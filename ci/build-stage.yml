parameters:
- name: publishPackages
  type: boolean
  default: false

stages:
- stage: Build
  displayName: Prepare orders-api
  jobs:
  - job: Prepare
    # Bound a hung restore/build instead of waiting for the platform default.
    timeoutInMinutes: 15
    pool:
      vmImage: ubuntu-24.04
    steps:
    - checkout: self
    - task: UseDotNet@2
      inputs:
        packageType: sdk
        version: 10.0.403
    - bash: bash ci/build.sh
      displayName: Build validate publish and pack
      env:
        PACKAGE_VERSION: 1.0.$(Build.BuildId)
        RUN_ID: $(Build.BuildId)
        SOURCE_REVISION: $(Build.SourceVersion)
    - publish: out/web
      artifact: orders-api-web
    # Module 1 never enables this branch. It is shown so the opt-in is visible.
    - ${{ if eq(parameters.publishPackages, true) }}:
      - task: NuGetAuthenticate@1
      - bash: |
          set -euo pipefail
          dotnet nuget push "out/packages/Globomantics.Orders.Contracts.1.0.$(Build.BuildId).nupkg" --source "https://pkgs.dev.azure.com/globomantics-devops/globomantics-orders/_packaging/globomantics-packages/nuget/v3/index.json" --api-key AzureArtifacts
        displayName: Publish contracts to globomantics-packages
        condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
